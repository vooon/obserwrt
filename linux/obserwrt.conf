# obserwrt - eBPF network observability agent (plain-Linux config)
#
# INI format. Mirrors the OpenWrt UCI option set (/etc/config/obserwrt) one
# for one, so one configuration diction is valid on both platforms.

[main]
# Observe these Linux netdevs (exact names or shell glob patterns).
# Empty = attach to nothing until configured (READY, safe default).
device = awg*
# Per-protocol idle timeouts (seconds); flows quieter than this are expired.
tcp_timeout = 300
udp_timeout = 60
icmp_timeout = 30
general_timeout = 10
# Flow map LRU capacity. 0 = the baked-in default of the loaded BPF object.
max_flows = 8192
# Prometheus textfile collector path; empty = self-observability disabled.
prometheus_textfile = /run/prometheus/textfile/obserwrt.prom
prometheus_interval = 20

[ipfix]
# UDP IPFIX (RFC 7011) to a collector (Akvorado/goflow2). Opt-in.
enabled = false
collector_host = 192.0.2.10
collector_port = 4739
# Per-router observation domain, for multi-collector deployments.
observation_domain = 1
# Optionally pin the local source address (empty = kernel choice).
source_address =

[syslog]
# RFC 5424 syslog exporter. Empty syslog_host = process-local syslog(3)
# (journald/rsyslog); non-empty = remote UDP syslog endpoint.
enabled = false
syslog_host =
syslog_port = 514
protocol = udp
format = json
# RFC 5424 HOSTNAME; empty = the machine hostname.
hostname =
source_address =