name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static-and-bpf:
    name: Static checks + eBPF smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libbpf-dev \
            linux-libc-dev \
            shellcheck \
            cmake \
            libjson-c-dev \
            pkg-config \
            gcc \
            make

      - name: Shellcheck init script
        if: ${{ hashFiles('obserwrt/files/obserwrt.init') != '' }}
        run: |
          set -euo pipefail
          shellcheck obserwrt/files/obserwrt.init

      - name: Lint ucode modules (node ESM parse + ucode rules)
        # ucode is ECMAScript-based; node's parser catches syntax, plus a couple
        # of ucode-specific checks (trailing ';' on export function, no arr.push()).
        if: ${{ hashFiles('obserwrt/files/usr/share/ucode/obserwrt/*.uc') != '' }}
        run: |
          node scripts/uc-lint.mjs

      - uses: ./.github/actions/build-ucode
        id: ucode
        # Upstream ucode modules provide the real `struct` (mocklib mocks
        # override socket/fs/log for the unit tests), needed for both -c and the
        # unit suite. Only needs json-c, already installed above.

      - name: Syntax-check ucode agent (ucode -c)
        # Compile each module to bytecode without executing it. ucode resolves
        # imports at compile time, but the OpenWrt modules (bpf/uci/ubus/uloop)
        # are not in the upstream tree, so strip the import/export lines and
        # prepend a stub header providing the referenced names.
        if: ${{ hashFiles('obserwrt/files/usr/share/ucode/obserwrt/*.uc') != '' }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          for f in obserwrt/files/usr/share/ucode/obserwrt/*.uc; do
            { cat obserwrt/tests/syntax-stub.uc
              sed -e '/^import /d' -e 's/^export //' "$f"; } \
              > "$work/$(basename "$f")"
          done
          for f in "$work"/*.uc; do
            "${{ steps.ucode.outputs.bin }}" -c "$f"
          done

      - name: Run ucode unit tests (mocked modules)
        # The fw4-style suite mocks socket/uci/log/bpf and takes the real
        # struct + fs from UCODE_MODULES, so it runs on the host ucode with no
        # OpenWrt target. Covers wire encoding, chunking, and the syslog sender.
        if: ${{ hashFiles('obserwrt/tests/run_tests.sh') != '' }}
        run: |
          set -euo pipefail
          UCODE_BIN="${{ steps.ucode.outputs.bin }}" \
          UCODE_MODULES="${{ steps.ucode.outputs.mods }}" \
            obserwrt/tests/run_tests.sh

      - name: Compile eBPF object (bpfel + bpfeb)
        # Clang cross-compiles the BPF C source for both target byte orders,
        # validating the parser, map defs and struct layout even before any
        # OpenWrt build. Object is discarded; we only check it compiles.
        #
        # The source uses the OpenWrt/bpf.mk include style (`<uapi/linux/bpf.h>`
        # + `<bpf/bpf_helpers.h>`), so we shim `uapi/linux` -> `/usr/include/linux`
        # and add the asm + libbpf paths from linux-libc-dev/libbpf-dev.
        if: ${{ hashFiles('obserwrt/src/obserwrt-bpf.c') != '' }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          mkdir -p "$out/uapi"
          ln -s /usr/include/linux "$out/uapi/linux"
          inc="-I$out -I/usr/include/x86_64-linux-gnu -I/usr/include"
          clang -O2 -g -target bpfel $inc \
            -c obserwrt/src/obserwrt-bpf.c -o "$out/obserwrt-bpfel.o"
          clang -O2 -g -target bpfeb $inc \
            -c obserwrt/src/obserwrt-bpf.c -o "$out/obserwrt-bpfeb.o"

  native:
    name: Native C++ build, golden harness, linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make clang-format clang-tidy

      - name: Configure + build (-Werror)
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: Golden-vector harness
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure

      - name: clang-format check (our sources, not the vendored inifile)
        run: |
          set -euo pipefail
          for f in $(find src tests -name '*.[ch]pp' | grep -v vendor); do
            clang-format --dry-run --Werror "$f"
          done

      - name: clang-tidy (compile DB, curated checks)
        run: |
          set -euo pipefail
          cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-tidy -j2
          checks="-checks=-*,clang-analyzer-*,bugprone-*,-bugprone-easily-swappable-parameters,performance-*"
          files=$(find src -name '*.cpp' | grep -v vendor)
          clang-tidy -p build-tidy --warnings-as-errors='*' \
            --checks "$checks" $files

  feed-health:
    name: Feed registration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate feed layout
        run: |
          set -euo pipefail
          # Every immediate subdirectory that looks like an OpenWrt package must
          # contain a Makefile, otherwise `scripts/feeds update`/`install` skips
          # it silently. Non-package dirs are exempt: `.github`, `docs`,
          # `scripts`, `src`, `tests`, `linux`, `.git`.
          for dir in $(find . -mindepth 1 -maxdepth 1 -type d ! -name '.*'); do
            dir="${dir#./}"
            case "$dir" in
              docs|scripts|src|tests|linux) continue ;;
            esac
            if [ -d "$dir" ] && [ ! -f "$dir/Makefile" ]; then
              echo "::error::$dir/ exists but has no Makefile"
              exit 1
            fi
          done
          echo "feed layout OK"