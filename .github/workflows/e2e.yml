name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goflow2-ipfix:
    name: goflow2 IPFIX decode (native emitter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make libbpf-dev clang linux-libc-dev

      - name: Build the native IPFIX emitter
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DOBSEWRRT_BUILD_TESTS=ON
          cmake --build build -j2 --target obserwrt-emit

      - name: Run goflow2 IPFIX e2e (decode emitted flows)
        # Runs the native obserwrt-emit (C++ IpfixExporter + UdpClient)
        # against a goflow2 collector (docker, --network host) and asserts it
        # decodes the expected IPv4 + IPv6 flows.
        run: |
          OBSERWRT_EMIT="$PWD/build/obserwrt-emit" sh scripts/test-ipfix.sh
